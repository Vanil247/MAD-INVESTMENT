  L.push("Total : "+fcfa(total()));
  L.push("Paiement : "+(ui.pay==="wave"?"Wave":"Orange Money"));
  L.push("Nom : "+ui.cust.name);L.push("WhatsApp : "+ui.cust.phone);
  if(ui.cust.email)L.push("Email : "+ui.cust.email);
  if(ui.cust.note)L.push("Note : "+ui.cust.note);
  L.push("Je t’envoie la capture du paiement.");
  return L.join("\n")
}
function stepper(){var s="";for(var i=1;i<=4;i++){s+=(i>1?'<hr>':'')+'<span class="'+(i<ui.step?'done':i===ui.step?'on':'')+'">'+(i<ui.step?'✓':i)+'</span>'}return '<div class="stepper" aria-label="Étape '+ui.step+' sur 4">'+s+'</div>'}
function drawer(){
  var it=cartItems(),t=total(),h='<div class="scrim" data-a="close"></div><aside class="drawer" role="dialog" aria-label="Panier"><header><h3>'+['','Panier','Tes infos','Paiement','Confirmation'][ui.step]+'</h3><button class="btn ghost sm" data-a="close">Fermer</button></header><div class="inner">'+stepper();
  if(!it.length){h+='<div class="empty"><h3 style="font:800 22px var(--disp);margin:0 0 6px;color:var(--fg)">Ton panier est vide</h3>Un guide pour décider, une préparation pour réussir.</div></div><footer class="dock"><button class="btn gold" data-a="close">Voir les guides</button></footer></aside>';return h}
  if(ui.step===1){h+=it.map(function(p){return '<div class="line">'+cover(p,true)+'<div class="i"><b>'+esc(p.title)+'</b><span>'+fcfa(p.price)+'</span></div><button class="rm" data-a="rm" data-id="'+p.id+'">Retirer</button></div>'}).join('')}
  if(ui.step===2){h+='<label class="f">Nom complet<input class="in" id="c_name" autocomplete="name" value="'+esc(ui.cust.name)+'"></label><label class="f">Numéro WhatsApp<input class="in" id="c_phone" type="tel" autocomplete="tel" placeholder="77 123 45 67" value="'+esc(ui.cust.phone)+'"></label><label class="f">Email (facultatif)<input class="in" id="c_email" type="email" autocomplete="email" value="'+esc(ui.cust.email)+'"></label><label class="f">Message (facultatif)<textarea class="in" id="c_note">'+esc(ui.cust.note)+'</textarea></label>'}
  if(ui.step===3){var num=ui.pay==="wave"?S.settings.wave:S.settings.om;h+='<div class="pay"><button data-a="pay" data-m="wave" aria-pressed="'+(ui.pay==="wave")+'">Wave</button>'+(S.settings.om.trim()?'<button data-a="pay" data-m="om" aria-pressed="'+(ui.pay==="om")+'">Orange Money</button>':'')+'</div><div class="box">Envoie exactement <b>'+fcfa(t)+'</b> au numéro :<div class="num"><span>'+esc(num)+'</span><button class="btn ghost sm" data-a="copy" data-t="'+esc(num)+'">Copier</button></div><p class="note" style="margin:8px 0 0">Garde la capture d’écran du paiement : tu l’enverras à l’étape suivante.</p></div>'}
  if(ui.step===4){h+='<div class="box"><b>Presque fini.</b> Envoie ta commande sur WhatsApp avec la capture du paiement. Le PDF t’est envoyé après vérification.</div><div class="msg">'+esc(waText())+'</div><a class="btn buy" target="_blank" rel="noopener" href="https://wa.me/'+esc(S.settings.wa)+'?text='+encodeURIComponent(waText())+'">Envoyer ma commande sur WhatsApp</a><button class="btn ghost sm" data-a="copy" data-t="'+esc(waText())+'">Copier le message</button><p class="note">Ouvrir WhatsApp ne valide pas la commande : elle est confirmée quand le vendeur reçoit ton message et ton paiement.</p>'}
  h+='</div><footer class="dock"><div class="tot"><span>Total</span><span>'+fcfa(t)+'</span></div><div class="acts">'+(ui.step>1?'<button class="btn ghost" data-a="back">Retour</button>':'')+(ui.step<4?'<button class="btn buy" data-a="next">'+(ui.step===1?'Continuer':ui.step===2?'Choisir le paiement':'J’ai payé, continuer')+'</button>':'<button class="btn ghost" data-a="clear">Vider le panier</button>')+'</div></footer></aside>';
  return h
}

function adminView(){
  var e=ui.edit,h='<div class="adm"><div class="wrap"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><h2>Gérer la boutique</h2><div class="acts"><button class="btn ghost sm" data-a="admin-close">Fermer</button><button class="btn buy sm" data-a="publish"'+(ui.dirty?'':' disabled')+'>Publier les modifications</button></div></div><p class="note">Les changements restent ici tant que tu n’as pas cliqué sur Publier. Une fois publiés, ils sont visibles par tous tes visiteurs.</p>';
  h+='<fieldset><legend>Paiement et contact</legend><div class="two"><label class="f">WhatsApp (avec indicatif, sans +)<input class="in" id="s_wa" value="'+esc(S.settings.wa)+'" inputmode="numeric"></label><label class="f">Numéro Wave<input class="in" id="s_wave" value="'+esc(S.settings.wave)+'"></label><label class="f">Numéro Orange Money<input class="in" id="s_om" value="'+esc(S.settings.om)+'"></label></div></fieldset>';
  h+='<fieldset class="plist"><legend>Produits ('+S.products.length+')</legend>'+S.products.map(function(p){return '<div class="line">'+cover(p,true)+'<div class="i"><b>'+esc(p.title)+'</b><span>'+fcfa(p.price)+' · '+esc(p.cat)+(p.pack?' · pack':'')+'</span></div><button class="btn ghost sm" data-a="edit" data-id="'+p.id+'">Modifier</button></div>'}).join('')+'<button class="btn gold" data-a="new">Ajouter un produit</button></fieldset>';
  if(e){h+='<fieldset><legend>'+(byId(e.id)?'Modifier le produit':'Nouveau produit')+'</legend><label class="f">Titre<input class="in" id="e_title" value="'+esc(e.title)+'"></label><label class="f">Description<textarea class="in" id="e_desc">'+esc(e.desc)+'</textarea></label><div class="two"><label class="f">Catégorie<input class="in" id="e_cat" list="cl" value="'+esc(e.cat)+'"><datalist id="cl">'+CATS_FIXED.map(function(c){return '<option value="'+c+'">'}).join('')+'</datalist></label><label class="f">Nombre de pages<input class="in" id="e_pages" type="number" min="0" value="'+esc(e.pages)+'"></label><label class="f">Prix (FCFA)<input class="in" id="e_price" type="number" min="0" value="'+esc(e.price)+'"></label><label class="f">Ancien prix (facultatif)<input class="in" id="e_old" type="number" min="0" value="'+esc(e.old||"")+'"></label></div><div class="f">Couleur de la couverture<div class="sw">'+COLORS.map(function(c){return '<button type="button" data-a="col" data-c="'+c+'" style="background:'+c+'" aria-label="Couleur '+c+'" aria-pressed="'+(e.color===c)+'"></button>'}).join('')+'</div></div><label class="f">Image de couverture (facultatif)<input class="in" id="e_img" type="file" accept="image/*"></label>'+(e.img?'<div><img src="'+esc(e.img)+'" alt="Couverture actuelle" style="max-height:120px;border-radius:8px"> <button class="rm" data-a="noimg">Retirer l’image</button></div>':'')+'<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="e_pack"'+(e.pack?' checked':'')+'> Afficher comme pack mis en avant</label><div class="acts"><button class="btn buy" data-a="save-e">Enregistrer le produit</button><button class="btn ghost" data-a="cancel-e">Annuler</button>'+(byId(e.id)?'<button class="btn ghost" style="color:var(--danger)" data-a="del-e">Supprimer</button>':'')+'</div></fieldset>'}
  return h+'</div></div>'
}

function render(){
  var a=document.activeElement,id=a&&a.id,pos=a&&a.selectionStart;
  var h=shop();if(ui.drawer)h+=drawer();if(ui.admin)h+=adminView();if(ui.toast)h+='<div class="toast" role="status">'+esc(ui.toast)+'</div>';
  document.getElementById("app").innerHTML=h;
  if(id){var el=document.getElementById(id);if(el&&el.type!=="file"){el.focus();try{if(pos!=null)el.setSelectionRange(pos,pos)}catch(e){}}}
}
function readE(){
  if(!ui.edit)return;var g=function(i){var el=document.getElementById(i);return el?el.value:null};
  var e=ui.edit,v;
  if((v=g("e_title"))!==null)e.title=v;if((v=g("e_desc"))!==null)e.desc=v;if((v=g("e_cat"))!==null)e.cat=v;
  if((v=g("e_pages"))!==null)e.pages=Number(v)||0;if((v=g("e_price"))!==null)e.price=Number(v)||0;if((v=g("e_old"))!==null)e.old=Number(v)||0;
  var pk=document.getElementById("e_pack");if(pk)e.pack=pk.checked
}
function readS(){var g=function(i){var el=document.getElementById(i);return el?el.value:null},v;
  if((v=g("s_wa"))!==null&&v.replace(/\D/g,"")!==S.settings.wa){S.settings.wa=v.replace(/\D/g,"");ui.dirty=true}
  if((v=g("s_wave"))!==null&&v!==S.settings.wave){S.settings.wave=v;ui.dirty=true}
  if((v=g("s_om"))!==null&&v!==S.settings.om){S.settings.om=v;ui.dirty=true}}

function buildDoc(){
  var css=document.getElementById("app-style").textContent,js=document.getElementById("app-script").textContent;
  var st=JSON.stringify(S).replace(/</g,"\\u003c");
  var link='<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>'+
  '<title>MAD\'INVESTMENT</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'+link+'\n<style id="app-style">'+css+'</style>\n<div id="app"></div>\n<script id="state" type="application/json">'+st+'<\/script>\n<script id="app-script">'+js.replace(/<\/script/gi,"<\\/script")+'<\/script></body></html>'
}

document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-a]");if(!t)return;var a=t.getAttribute("data-a"),id=t.getAttribute("data-id");
  if(a==="cat"){ui.cat=t.getAttribute("data-c");render()}
  else if(a==="add"){var i=ui.cart.indexOf(id);if(i<0){ui.cart.push(id);toast("Ajouté au panier")}else{ui.drawer=true;ui.step=1;render()}saveCart()}
  else if(a==="buy"){if(ui.cart.indexOf(id)<0)ui.cart.push(id);saveCart();ui.drawer=true;ui.step=1;render()}
  else if(a==="cart"){ui.drawer=true;ui.step=1;render()}
  else if(a==="close"){ui.drawer=false;render()}
  else if(a==="rm"){ui.cart=ui.cart.filter(function(x){return x!==id});saveCart();render()}
  else if(a==="clear"){ui.cart=[];saveCart();ui.step=1;render()}
  else if(a==="pay"){ui.pay=t.getAttribute("data-m");render()}
  else if(a==="copy"){copy(t.getAttribute("data-t"))}
  else if(a==="back"){ui.step=Math.max(1,ui.step-1);render()}
  else if(a==="next"){
    if(ui.step===2){if(!ui.cust.name.trim()||ui.cust.phone.replace(/\D/g,"").length<8){toast("Indique ton nom et un numéro WhatsApp valide");return}}
    ui.step=Math.min(4,ui.step+1);render()}
  else if(a==="admin"){ui.admin=true;render()}
  else if(a==="admin-close"){readS();ui.admin=false;ui.edit=null;render()}
  else if(a==="new"){readS();ui.edit={id:"p"+Date.now().toString(36),title:"",cat:"Financement",desc:"",pages:0,price:0,old:0,color:COLORS[0],img:"",pack:false};render()}
  else if(a==="edit"){readS();ui.edit=JSON.parse(JSON.stringify(byId(id)));render()}
  else if(a==="col"){readE();ui.edit.color=t.getAttribute("data-c");render()}
  else if(a==="noimg"){readE();ui.edit.img="";render()}
  else if(a==="cancel-e"){ui.edit=null;render()}
  else if(a==="del-e"){S.products=S.products.filter(function(p){return p.id!==ui.edit.id});ui.cart=ui.cart.filter(function(x){return x!==ui.edit.id});saveCart();ui.edit=null;ui.dirty=true;render()}
  else if(a==="save-e"){readE();readS();var e=ui.edit;if(!e.title.trim()||!e.price){toast("Titre et prix obligatoires");return}e.cat=e.cat.trim()||"Divers";
    var ix=S.products.map(function(p){return p.id}).indexOf(e.id);if(ix>-1)S.products[ix]=e;else S.products.unshift(e);ui.edit=null;ui.dirty=true;render()}
  else if(a==="publish"){readS();claude.use("artifact").then(function(art){if(!art){toast("Publication indisponible ici");return}return art.publish(buildDoc())}).catch(function(err){toast(err&&err.code==="conflict"?"Une version plus récente existe, la page se recharge":"Publication impossible : "+((err&&err.message)||"erreur"))})}
});
document.addEventListener("input",function(ev){
  var id=ev.target.id;
  if(id==="q"){ui.q=ev.target.value;var l=filtered();var g=document.querySelector(".grid");render()}
  else if(id==="c_name")ui.cust.name=ev.target.value;else if(id==="c_phone")ui.cust.phone=ev.target.value;else if(id==="c_email")ui.cust.email=ev.target.value;else if(id==="c_note")ui.cust.note=ev.target.value;
});
document.addEventListener("change",function(ev){
  if(ev.target.id==="e_img"&&ev.target.files[0]){
    readE();var f=ev.target.files[0];
    claude.use("assets").then(function(as){
      if(as){return as.upload(f).then(function(r){ui.edit.img=r.url;render()})}
      var fr=new FileReader();fr.onload=function(){ui.edit.img=String(fr.result);render()};fr.readAsDataURL(f)
    }).catch(function(){toast("Image non envoyée")})
  }
});
render();
try{fetch("products.json?v="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(j){if(j&&j.products&&j.settings){S=j;render()}}).catch(function(){})}catch(e){}
if(window.claude&&claude.use){claude.use("user").then(function(u){if(u&&u.canEdit&&u.canEdit()){ui.canEdit=true;render()}}).catch(function(){})}
})();
</script>
</body></html>
